name: nutricare
description: "NutriCare - Smart Nutrition Tracker"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.1.1
  sqflite: ^2.4.2
  path: ^1.9.1
  intl: ^0.19.0
  salomon_bottom_bar: ^3.3.2
  csv: ^6.0.0
  google_fonts: ^6.1.0
  crypto: ^3.0.3
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.2
  path_provider: ^2.1.2
  concentric_transition: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nutrition.csv
    - assets/logo.png
